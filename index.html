<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#B4530A">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Hachi Iraqi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Naskh+Arabic:wght@500;700&display=swap">
<style>
/* Layout: one-column phone app, bottom tab bar, a single "card" stage for drills. Amber = a glass of Iraqi chai. */
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --sunk:#E8ECE7; --fg:#18212B; --muted:#5A6573; --line:#DCE1DA;
  --accent:#B4530A; --accent-ink:#FFFFFF; --accent-soft:#F7E6D3;
  --good:#167A3E; --good-soft:#DDF1E3; --bad:#B42318; --bad-soft:#FBE3E0;
  --f-display:"Bricolage Grotesque", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --f-body:"IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-ar:"Noto Naskh Arabic", "IBM Plex Sans Arabic", "Geeza Pro", serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161B; --surface:#1A2129; --sunk:#232C36; --fg:#E8ECEF; --muted:#9AA6B2; --line:#2C3743;
  --accent:#F29B38; --accent-ink:#1A1206; --accent-soft:#3A2814;
  --good:#4CC27A; --good-soft:#163222; --bad:#F17C6E; --bad-soft:#3A1A17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161B; --surface:#1A2129; --sunk:#232C36; --fg:#E8ECEF; --muted:#9AA6B2; --line:#2C3743;
  --accent:#F29B38; --accent-ink:#1A1206; --accent-soft:#3A2814;
  --good:#4CC27A; --good-soft:#163222; --bad:#F17C6E; --bad-soft:#3A1A17; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 96px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:28px;font-weight:800} h2{font-size:21px;font-weight:800} h3{font-size:16px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,.tab:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;font-weight:600;background:var(--sunk);color:var(--fg)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
header.top{display:flex;justify-content:space-between;align-items:flex-end;padding-block:8px 18px}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px}
.brand span{color:var(--accent)}
.streak{display:flex;align-items:center;gap:6px;font-weight:600;font-variant-numeric:tabular-nums}
.glass{width:16px;height:20px;border:2px solid var(--accent);border-top:0;border-radius:3px 3px 6px 6px;position:relative;overflow:hidden}
.glass i{position:absolute;left:0;right:0;bottom:0;background:var(--accent)}
/* today */
.hero{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:end}
.hero .big{font-family:var(--f-display);font-size:44px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.week i{width:100%;aspect-ratio:1;max-width:38px;border-radius:9px;background:var(--sunk)}
.week i.on{background:var(--accent)}
.week i.today{outline:2px solid var(--accent);outline-offset:1px}
/* units */
.unit{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.unit .n{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--accent);text-align:center}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--good)}
.phrase{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 0;border-bottom:1px solid var(--line)}
.phrase:last-child{border-bottom:0}
.ar{font-family:var(--f-ar);direction:rtl;font-weight:700}
.phrase .ar{font-size:21px;line-height:1.5}
.tr{font-weight:600;color:var(--accent)}
.icon-btn{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.key{font-size:13px;background:var(--sunk);border-radius:8px;padding:4px 8px}
.key b{font-family:var(--f-ar);margin-left:4px}
/* session */
.sess-top{display:flex;align-items:center;gap:12px;padding-block:6px 14px}
.sess-top .bar{flex:1;margin:0;height:8px;border-radius:4px}
.sess-top .bar i{background:var(--accent);transition:width .3s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 18px;min-height:340px;display:flex;flex-direction:column;gap:16px}
.mode{display:inline-flex;align-self:flex-start;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.mode.new{background:var(--good-soft);color:var(--good)}
.prompt{font-family:var(--f-display);font-size:26px;font-weight:600;line-height:1.25;text-wrap:balance}
.card .ar.big{font-size:38px;line-height:1.6}
.card .tr.big{font-size:21px}
.no-latin .tr,.no-latin .latin-only{display:none}
.note{font-size:13.5px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.say{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.mic{width:10px;height:10px;border-radius:50%;background:var(--bad);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.answer{display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px dashed var(--line)}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grades .btn{flex-direction:column;gap:0;min-height:58px;line-height:1.2}
.grades small{font-weight:400;font-size:11.5px;opacity:.8}
.g-again{background:var(--bad-soft)!important;color:var(--bad)!important}
.g-good{background:var(--good-soft)!important;color:var(--good)!important}
.spacer{flex:1}
/* dialogue */
.bubble{max-width:88%;padding:12px 14px;border-radius:16px;display:flex;flex-direction:column;gap:4px}
.bubble.them{background:var(--surface);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.bubble.you{background:var(--accent-soft);align-self:flex-end;border-bottom-right-radius:4px}
.bubble .ar{font-size:22px;line-height:1.5}
.bubble.hidden-line{background:transparent;border:2px dashed var(--accent)}
.chat{display:flex;flex-direction:column;gap:10px}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 8px;font-size:12px;color:var(--muted);font-weight:500}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px}
.seg button{flex:1;min-height:38px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg)}
.setting{display:flex;flex-direction:column;gap:8px;padding-block:12px;border-bottom:1px solid var(--line)}
.setting:last-child{border-bottom:0}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.done-mark{font-family:var(--f-ar);font-size:64px;color:var(--accent);line-height:1}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app"></div>

  <button class="tab" data-tab="units"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>Units</button>
  <button class="tab" data-tab="talk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v10H9l-5 4z"/></svg>Role-play</button>
  <button class="tab" data-tab="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progress</button>
</div></nav>

const CARDS = []; UNITS.forEach((u,ui)=>u.c.forEach((c,ci)=>CARDS.push({id:ui+"-"+ci,u:ui,ar:c[0],tr:c[1],en:c[2],note:c[3]||""})));
const BYID = Object.fromEntries(CARDS.map(c=>[c.id,c]));

/* ---------- State & persistence ---------- */
const LSKEY="hachi-iraqi-v1";
const DAY=86400000;
function fresh(){return {v:1,cards:{},days:{},newLog:{},settings:{newPerDay:8,rate:0.8,theme:"",latin:0},updatedAt:0}}
let S=fresh();
try{const raw=localStorage.getItem(LSKEY); if(raw) S=Object.assign(fresh(),JSON.parse(raw));}catch(e){}
if(S.settings.latin==null)S.settings.latin=0;
let dbDoc=null, saveTimer=null;
function save(){
  S.updatedAt=Date.now();
  try{localStorage.setItem(LSKEY,JSON.stringify(S))}catch(e){}
  if(dbDoc){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{dbDoc.set({json:JSON.stringify(S),updatedAt:S.updatedAt}).catch(()=>{})},1500)}
}
(async()=>{
  try{
    if(!window.claude||!claude.use) return;
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    dbDoc=db.doc("data/users/"+id+"/progress");
    const snap=await dbDoc.get(); const d=snap.exists?snap.data():snap.data&&snap.data();
    if(d&&d.json&&(d.updatedAt||0)>(S.updatedAt||0)){
      S=Object.assign(fresh(),JSON.parse(d.json));if(S.settings.latin==null)S.settings.latin=0;
      try{localStorage.setItem(LSKEY,JSON.stringify(S))}catch(e){}
      if(!sess) render();
    }else if(S.updatedAt){dbDoc.set({json:JSON.stringify(S),updatedAt:S.updatedAt}).catch(()=>{})}
  }catch(e){}
})();

/* ---------- Dates ---------- */
function dkey(t=Date.now()){const d=new Date(t);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function sod(t=Date.now()){const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()}
function streak(){let n=0,t=Date.now();if(!S.days[dkey(t)])t-=DAY;while(S.days[dkey(t)]){n++;t-=DAY}return n}

/* ---------- Spaced repetition ---------- */
function dueCards(){const now=Date.now();return CARDS.filter(c=>S.cards[c.id]&&S.cards[c.id].d<=now)}
function newLeftToday(){return Math.max(0,S.settings.newPerDay-(S.newLog[dkey()]||0))}
function unseen(unit){return CARDS.filter(c=>!S.cards[c.id]&&(unit==null||c.u===unit))}
function learned(c){return !!S.cards[c.id]}
function grade(id,g){
  const now=Date.now(); let s=S.cards[id]||{r:0,i:0,e:2.5,d:now,l:0};
  if(g===0){s.r=0;s.i=0;s.l++;s.e=Math.max(1.3,s.e-0.2);s.d=now+60000}
  else if(g===1){s.i=s.r===0?1:s.r===1?3:Math.round(s.i*s.e);s.r++;s.d=sod(now)+s.i*DAY+3*3600000}
  else{s.i=s.r===0?3:Math.round(Math.max(s.i,1)*s.e*1.3);s.e+=0.15;s.r++;s.d=sod(now)+s.i*DAY+3*3600000}
  S.cards[id]=s;
  const k=dkey(now); S.days[k]=(S.days[k]||0)+1; save();
}
function label(g,id){const s=S.cards[id]||{r:0,i:0,e:2.5};if(g===0)return"1 min";const i=g===1?(s.r===0?1:s.r===1?3:Math.round(s.i*s.e)):(s.r===0?3:Math.round(Math.max(s.i,1)*s.e*1.3));return i===1?"1 day":i<30?i+" days":Math.round(i/30)+" mo"}

/* ---------- Speech ---------- */
let arVoice=null;
function pickVoice(){if(!("speechSynthesis" in window))return;const v=speechSynthesis.getVoices();arVoice=v.find(x=>/^ar[-_]IQ/i.test(x.lang))||v.find(x=>/^ar/i.test(x.lang))||null}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(text){
  const T=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.TextToSpeech;
  if(T){T.stop().catch(()=>{});T.speak({text:text.replace(/[\/]/g,"،"),lang:"ar-SA",rate:S.settings.rate,category:"playback"}).catch(()=>toast("No Arabic voice found. Add one in your phone's text-to-speech settings."));return}
  if(!("speechSynthesis" in window)){toast("This browser can't play speech");return}
  pickVoice();
  const u=new SpeechSynthesisUtterance(text.replace(/[\/]/g,"،"));u.lang=arVoice?arVoice.lang:"ar-SA";if(arVoice)u.voice=arVoice;u.rate=S.settings.rate;
  speechSynthesis.cancel();speechSynthesis.speak(u);
  if(!arVoice)toast("No Arabic voice found. Add one in your phone's text-to-speech settings.");
}

/* ---------- Session ---------- */
function buildSession(extraNew,unit){
  const q=[];
  const due=dueCards().sort((a,b)=>S.cards[a.id].d-S.cards[b.id].d);
  due.forEach(c=>q.push({id:c.id,m:Math.random()<0.7?"say":"hear"}));
  const n=extraNew!=null?extraNew:newLeftToday();
  const news=unseen(unit).slice(0,n);
  // introduce each new phrase, then test it 3 cards later
  news.forEach((c,i)=>{q.splice(Math.min(q.length,i*2),0,{id:c.id,m:"intro"})});
  const out=[];q.forEach(it=>out.push(it));
  news.forEach(c=>{const pos=out.findIndex(x=>x.id===c.id&&x.m==="intro");out.splice(Math.min(out.length,pos+4),0,{id:c.id,m:"say",isNew:true})});
  if(!out.length)return null;
  return{q:out,i:0,shown:false,total:out.length,newIds:news.map(c=>c.id),count:0};
}

  const c=BYID[it.id], pct=Math.round(sess.i/sess.q.length*100);

    <div class="ar big">${esc(c.ar)}</div><div class="tr big">${esc(c.tr)}</div><p class="prompt" style="font-size:20px">${esc(c.en)}</p>
    ${c.note?`<p class="note">${esc(c.note)}</p>`:""}
    <div class="say"><span class="mic"></span>Listen, then say it out loud three times.</div><div class="spacer"></div>
    <div class="row"><button class="icon-btn" data-say="${esc(c.ar)}" aria-label="Play">${SPK}</button><button class="btn primary" id="gotit" style="flex:1">Got it</button></div>`}
  else if(it.m==="say"){body=`<span class="mode">Say it in Iraqi</span><p class="prompt">${esc(c.en)}</p>
    ${!sess.shown?`<div class="say"><span class="mic"></span>Say it out loud first, then check.</div><div class="spacer"></div><button class="btn primary block" id="reveal">Check</button>`:
    `<div class="answer"><div class="spread"><div style="min-width:0"><div class="ar big">${esc(c.ar)}</div><div class="tr big">${esc(c.tr)}</div></div><button class="icon-btn" data-say="${esc(c.ar)}" aria-label="Play">${SPK}</button></div>${c.note?`<p class="note">${esc(c.note)}</p>`:""}</div><div class="spacer"></div>${grades(c.id)}`}`}
  else{body=`<span class="mode">What does it mean?</span><div class="spread"><div style="min-width:0"><div class="ar big">${esc(c.ar)}</div><div class="tr big">${esc(c.tr)}</div></div><button class="icon-btn" data-say="${esc(c.ar)}" aria-label="Play">${SPK}</button></div>
    ${!sess.shown?`<div class="say"><span class="mic"></span>Say the meaning out loud, then check.</div><div class="spacer"></div><button class="btn primary block" id="reveal">Check</button>`:
    `<div class="answer"><p class="prompt" style="font-size:22px">${esc(c.en)}</p>${c.note?`<p class="note">${esc(c.note)}</p>`:""}</div><div class="spacer"></div>${grades(c.id)}`}`}
  return `<div class="sess-top"><button class="btn" id="quit" aria-label="End session" style="min-height:40px;padding:0 12px">✕</button><div class="bar"><i style="width:${pct}%"></i></div><span class="muted" style="font-variant-numeric:tabular-nums;font-size:13px">${sess.i}/${sess.q.length}</span></div><div class="card">${body}</div>`}
function grades(id){return `<div class="grades"><button class="btn g-again" data-g="0">Hard<small>${label(0,id)}</small></button><button class="btn g-good" data-g="1">Got it<small>${label(1,id)}</small></button><button class="btn" data-g="2">Easy<small>${label(2,id)}</small></button></div>`}

/* ---------- Render & events ---------- */
function render(){
  applyTheme();document.body.classList.toggle("no-latin",!S.settings.latin);
  document.getElementById("tabs").hidden=!!sess;
  $app.innerHTML=sess?vSession():tab==="today"?vToday():tab==="units"?vUnits():tab==="talk"?vTalk():vMe();
  document.querySelectorAll(".tab").forEach(b=>{if(b.dataset.tab===tab&&!sess)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
}
function startSession(extra,unit){const s=buildSession(extra,unit);if(!s){toast("Nothing to practise right now");return}sess=s;if(s.newIds.length){const k=dkey();S.newLog[k]=(S.newLog[k]||0)+s.newIds.length;save()}window.scrollTo(0,0);render();autoplay()}
function autoplay(){const it=sess&&sess.q[sess.i];if(it&&(it.m==="intro"||it.m==="hear"))speak(BYID[it.id].ar)}
function nextCard(){sess.i++;sess.shown=false;window.scrollTo(0,0);render();autoplay()}
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.say!=null){speak(t.dataset.say);return}
  if(t.dataset.tab){tab=t.dataset.tab;openUnit=null;talk=null;render();window.scrollTo(0,0);return}
  if(t.dataset.unit!=null){openUnit=+t.dataset.unit;render();window.scrollTo(0,0);return}
  if(t.dataset.talk!=null){talk={u:+t.dataset.talk,step:0,revealed:false,swap:false};prepTalk();render();window.scrollTo(0,0);return}
  if(t.dataset.set){const k=t.dataset.set,v=t.dataset.val;S.settings[k]=k==="theme"?v:+v;save();render();if(k==="rate")speak("هلا، شلونك؟");return}
  if(t.dataset.g!=null){const it=sess.q[sess.i],g=+t.dataset.g;grade(it.id,g);sess.count++;if(g===0)sess.q.splice(Math.min(sess.q.length,sess.i+4),0,{id:it.id,m:"say"});nextCard();return}
  switch(t.id){
    case"go":startSession();break;
    case"extra":startSession(5);break;
    case"studyU":startSession(8,openUnit);break;
    case"talkU":tab="talk";talk={u:openUnit,step:0,revealed:false,swap:false};openUnit=null;prepTalk();render();break;
    case"back":openUnit=null;render();break;
    case"gotit":{const it=sess.q[sess.i];const k=dkey();S.days[k]=S.days[k]||0;nextCard();break}
    case"reveal":sess.shown=true;render();speak(BYID[sess.q[sess.i].id].ar);break;
    case"quit":sess=null;render();break;
    case"finish":sess=null;tab="today";render();break;
    case"tBack":talk=null;render();break;
    case"tReveal":talk.revealed=true;render();speak(curLine()[1]);break;
    case"tNext":talk.step++;talk.revealed=false;render();if(curLine()[0]==="them")speak(curLine()[1]);break;
    case"tAgain":talk.step=0;talk.revealed=false;prepTalk();render();break;
    case"tSwap":talk.swap=!talk.swap;talk.step=0;talk.revealed=false;prepTalk();render();break;
  }
});
function curLine(){return UNITS[talk.u].d[talk.step]}
function prepTalk(){
  const base=UNITS[talk.u]._d||(UNITS[talk.u]._d=UNITS[talk.u].d);
  UNITS[talk.u].d=talk.swap?base.map(L=>[L[0]==="you"?"them":"you",L[1],L[2],L[3]]):base;
  if(curLine()[0]==="them")setTimeout(()=>speak(curLine()[1]),150);
}
render();
</script>

name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - name: Prepare
        run: |
          mkdir -p www && cp index.html www/index.html
          echo '{"appId":"com.zhyar.hachiiraqi","appName":"Hachi Iraqi","webDir":"www"}' > capacitor.config.json
          npm init -y
          npm install @capacitor/core@8.5.3 @capacitor/android@8.5.3 @capacitor/cli@8.5.3 @capacitor-community/text-to-speech@8.0.2
          npx cap add android
          npx cap sync android
      - name: Build
        run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: hachi-iraqi-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
